info:
  note: >-
    In 2002 and 2003, the Steuersatzeinkommen per person is rounded down to the next
    multiple of 36 € and increased by 18 € (§ 32a Abs. 2 EStG). Under the splitting
    procedure, the rounding applies to half of the joint amount (§ 32a Abs. 5 EStG):
    36 × floor(50.000 / 36) + 18 = 49.986 €. The first person is assessed individually,
    the other two jointly; the spouse without wages has 21.044 € Arbeitslosengeld less
    the Arbeitnehmer-Pauschbetrag of 1.044 €.
  precision_atol: 1.0e-06
  source: Regression test.
