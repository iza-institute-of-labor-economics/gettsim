  note: >-
    For Arbeitslosengeld II, Sozialhilfe, Kinderzuschlag and Unterhaltsvorschuss, the
    Elterngeld remains exempt in the amount of the income from employment before the
    birth, up to 300 €. Person 0 receives 200 € Elterngeld with 300 € Mutterschaftsgeld
    credited against it, person 1 100 € with 50 € credited, person 2 400 € without
    income before the birth. Before 18.09.2012, only the Elterngeld itself is exempt
    (§ 10 Abs. 5 S. 2 BEEG as inserted by Art. 14 Nr. 4 G. v. 09.12.2010, BGBl. I S.
    1896); the credited Mutterschaftsgeld is not.
