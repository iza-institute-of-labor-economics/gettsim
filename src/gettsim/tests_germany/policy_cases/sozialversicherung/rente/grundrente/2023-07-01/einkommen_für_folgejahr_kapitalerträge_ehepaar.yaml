info:
  note: |-
    GRA Beispiel 10, Fall A: jointly assessed spouses with joint capital income of
    5,000.00 EUR in 2023, less the joint Sparer-Pauschbetrag of 2,000.00 EUR;
    3,000.00 EUR are credited, "jedem Ehegatten zur Hälfte zuzurechnen"
    (§ 97a Abs. 2 S. 1 Nr. 3 SGB VI).
    Assumed: the capital income is held equally (2,500.00 each); zvE and pensions
    are zero; the capital income is declared (§ 97a Abs. 6).
    Per spouse: 3,000.00 / 2 / 12 = 125.00.
