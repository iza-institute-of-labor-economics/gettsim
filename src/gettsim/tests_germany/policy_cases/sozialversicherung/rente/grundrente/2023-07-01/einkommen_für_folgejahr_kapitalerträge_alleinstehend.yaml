---
info:
  note: |-
    GRA Beispiel 4: a single Berechtigter has Einkünfte aus Kapitalvermögen of
    1,580.00 EUR in 2023, less the Sparer-Pauschbetrag of 1,000.00 EUR; credited
    capital income 580.00 EUR per year (§ 97a Abs. 2 S. 1 Nr. 3 SGB VI).
    The target computes, in a run for the income year, the input
    `einkommen_vorjahr_m` of the following year: (person's share of the zvE +
    steuerfreier Teil of pensions + Abgeltungsteuer capital income) / 12.
    Assumed: zvE and pensions are zero; the capital income is declared (§ 97a
    Abs. 6).
    580.00 / 12 = 48.33.
  precision_atol: 0.01
  source: |-
    https://rvrecht.deutsche-rentenversicherung.de/SharedDocs/rvRecht/01_GRA_SGB/06_SGB_VI/pp_0076_100/gra_sgb006_p_0097a.html
inputs:
  assumed:
    einkommensteuer:
      einkünfte:
        sonstige:
          rente:
            alter_beginn_leistungsbezug_sonstige_private_vorsorge:
              - 65
      zu_versteuerndes_einkommen_y_sn:
        - 0.0
    einnahmen:
      renten:
        aus_berufsständischen_versicherungen_m:
          - 0.0
        basisrente_m:
          - 0.0
        betriebliche_altersvorsorge_m:
          - 0.0
        geförderte_private_vorsorge_m:
          - 0.0
        sonstige_private_vorsorge_m:
          - 0.0
    sozialversicherung:
      rente:
        altersrente:
          bruttorente_m:
            - 0.0
        bezieht_altersrente:
          - false
        erwerbsminderung:
          betrag_m:
            - 0.0
        grundrente:
          betrag_m:
            - 0.0
        jahr_renteneintritt:
          - 2020
  provided:
