---
info:
  note: |-
    DRV-Broschüre "Grundrente: Zuschlag zur Rente", 5. Auflage (5/2026), p. 15 f.,
    "Dieter P.": widower, monthly income 1,550 EUR; 1,492 EUR are not credited;
    60 % of 58 EUR = 34.80 EUR.
    Assumed: Zuschlag before crediting 100.00 EUR (not stated). A widower has no
    spouse, so the single thresholds apply.
    Thresholds 2026 (Rentenwert of 01.07.2025, 40.79):
    36.56 * 40.79 = 1,491.28 -> 1,492; 46.78 * 40.79 = 1,908.16 -> 1,909.
    Credited: 0.6 * (1,550 - 1,492) = 34.80. Zuschlag: 100.00 - 34.80 = 65.20.
  precision_atol: 0.01
  source: |-
    https://www.deutsche-rentenversicherung.de/SharedDocs/Downloads/DE/Broschueren/national/grundrente_zuschlag_zur_rente.pdf?__blob=publicationFile&v=10
inputs:
  assumed:
    sozialversicherung:
      rente:
        grundrente:
          basisbetrag_m:
            - 100.0
  provided:
    familie:
      p_id_ehepartner:
        - -1
    hh_id:
      - 0
    p_id:
      - 0
    sozialversicherung:
      rente:
        grundrente:
          einkommen_vorjahr_m:
            - 1550.0
outputs:
  sozialversicherung:
    rente:
      grundrente:
        anzurechnendes_einkommen_m:
          - 34.8
        betrag_m:
          - 65.2
