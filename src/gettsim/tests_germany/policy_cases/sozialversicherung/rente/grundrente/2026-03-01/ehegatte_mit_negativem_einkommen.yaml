---
info:
  note: |-
    Hand-derived. The § 97a Abs. 2 S. 1 income is not floored at zero, so a spouse's
    negative income (losses in the zvE) offsets the Berechtigter's income.
    Berechtigter income 2,800.00 EUR, Zuschlag before crediting 300.00 EUR; spouse
    income -300.00 EUR, no Zuschlag. Couple sum 2,500.00.
    Couple thresholds 2026: 2,327 / 2,744 (57.03 / 67.27 * 40.79, rounded up).
    Credited: 0.6 * (2,500 - 2,327) = 103.80 for both spouses.
    Zuschlag: 300.00 - 103.80 = 196.20.
    (Flooring the spouse at zero would credit 306.20 and pay no Zuschlag.)
  precision_atol: 0.01
  source: § 97a Abs. 2 S. 1, Abs. 4 S. 4 SGB VI
