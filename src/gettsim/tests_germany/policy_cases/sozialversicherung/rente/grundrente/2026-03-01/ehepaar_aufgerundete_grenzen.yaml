info:
  note: |-
    Hand-derived. Four married couples; in each, one spouse has a Zuschlag before
    crediting of 300.00 EUR and the other none. The couple's income sums lie on both
    sides of each couple threshold (§ 97a Abs. 4 S. 4 SGB VI), split equally between
    the spouses. Abs. 4 S. 1 rounds every threshold up to a full Euro.
    Thresholds 2026 (Rentenwert of 01.07.2025, 40.79, Abs. 4 S. 5):
    57.03 * 40.79 = 2,326.2537 -> 2,327; 67.27 * 40.79 = 2,743.9433 -> 2,744.
    - 2,326.50 (1,163.25 each): 0.00; Zuschlag 300.00.
    - 2,328.00 (1,164.00 each): 0.6 * 1.00 = 0.60; Zuschlag 299.40.
    - 2,743.50 (1,371.75 each): 0.6 * 416.50 = 249.90; Zuschlag 50.10.
    - 2,745.00 (1,372.50 each): 0.6 * 417 + 1.00 = 251.20; Zuschlag 48.80.
    Both spouses get the same credited income, computed from the couple's sum.
  precision_atol: 0.01
  source: § 97a Abs. 4 S. 1-5 SGB VI
