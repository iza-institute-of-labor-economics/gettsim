info:
  note: |-
    Hand-derived. From 01.01.2027 § 97a Abs. 2 S. 7 SGB VI is struck (SGB
    VI-Anpassungsgesetz v. 22.12.2025, BGBl. 2025 I Nr. 355, Art. 1 Nr. 11 Buchst.
    a); the crediting rule of Abs. 4 is unchanged. The thresholds for 2027 rest on
    the Rentenwert of 01.07.2026 (42.52, Abs. 4 S. 5), rounded up (Abs. 4 S. 1):
    36.56 * 42.52 = 1,554.53 -> 1,555; 46.78 * 42.52 = 1,989.09 -> 1,990;
    57.03 * 42.52 = 2,424.92 -> 2,425; 67.27 * 42.52 = 2,860.32 -> 2,861.
    Zuschlag before crediting 300.00 EUR in every household:
    - Single, income 1,554.80 (between the unrounded and the rounded lower
      threshold): 0.00; Zuschlag 300.00.
    - Single, income 2,000.00: 0.6 * (1,990 - 1,555) + 10 = 261.00 + 10.00 =
      271.00; Zuschlag 29.00.
    - Married, 1,435.00 each (sum 2,870.00), Zuschlag for one spouse:
      0.6 * (2,861 - 2,425) + 9 = 261.60 + 9.00 = 270.60; Zuschlag 29.40.
  precision_atol: 0.01
  source: |-
    https://www.recht.bund.de/bgbl/1/2025/355/VO.html
