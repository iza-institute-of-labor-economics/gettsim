info:
  note: |-
    Single pensioner eligible for Grundrente with exactly 396 months of
    Grundrentenzeiten (boundary of the 33-year requirement). Tests the § 17a WoGG
    Grundrentenfreibetrag in the case where the formula binds:
    100 + 0.3 · (500 - 100) = 220 < 563 / 2 = 281.50 (half of Regelbedarfsstufe 1).
    Created with NRW Wohngeldrechner (Wohnort Bonn, Mietstufe 5) that doesn't check
    for Mindesteinkommen.
  precision_atol: 0.01
