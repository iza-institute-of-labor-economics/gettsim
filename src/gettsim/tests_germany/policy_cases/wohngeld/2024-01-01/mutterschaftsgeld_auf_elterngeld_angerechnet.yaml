    Mutterschaftsgeld after the birth is credited against the Elterngeld (§ 3 Abs. 1
    S. 1 Nr. 1 BEEG). For Wohngeld, the Elterngeld together with the credited
    Mutterschaftsgeld remains exempt up to 300 € (§ 14 Abs. 2 Nr. 6 WoGG, § 10 Abs. 1
    BEEG); Mutterschaftsgeld above the Elterngeld counts in full. Elterngeld before
    crediting: 460 €, 700 €, 460 €, none. Mutterschaftsgeld: 340 €, 1.000 €, none, 340 €
